<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星座占卜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;color:#e0e0e0}
.page{display:none;min-height:100vh;padding:20px}
.page.active{display:flex;flex-direction:column;align-items:center}
/* Login */
#login-page{justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e)}
.login-box{background:rgba(255,255,255,0.08);border-radius:20px;padding:40px;width:90%;max-width:400px;text-align:center;backdrop-filter:blur(10px)}
.login-box h1{font-size:2em;margin-bottom:20px;background:linear-gradient(45deg,#e94560,#0f3460);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box input{padding:12px 20px;border:none;border-radius:25px;width:100%;margin:10px 0;font-size:1em;background:rgba(255,255,255,0.1);color:#e0e0e0;outline:none}
.login-box input::placeholder{color:rgba(255,255,255,0.5)}
.avatar-section{margin:15px 0}
.avatar-section h3{margin-bottom:10px;color:#e94560}
.avatar-presets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.avatar-opt{width:50px;height:50px;border-radius:50%;cursor:pointer;border:3px solid transparent;font-size:2em;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);transition:all 0.3s}
.avatar-opt:hover,.avatar-opt.selected{border-color:#e94560;transform:scale(1.1);background:rgba(233,69,96,0.2)}
.avatar-upload-wrap{margin:10px 0}
.avatar-upload-wrap input[type=file]{display:none}
.avatar-upload-wrap label{cursor:pointer;color:#e94560;text-decoration:underline;font-size:0.9em}
.avatar-preview{width:80px;height:80px;border-radius:50%;margin:10px auto;overflow:hidden;border:3px solid #e94560;display:none}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1em;cursor:pointer;transition:all 0.3s;font-weight:bold}
.btn-primary{background:linear-gradient(45deg,#e94560,#0f3460);color:white}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(233,69,96,0.4)}
/* Main */
#main-page{background:linear-gradient(135deg,#1a1a2e,#16213e);padding-top:80px}
.top-bar{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar{width:40px;height:40px;border-radius:50%;border:2px solid #e94560}
.user-nick{font-weight:bold;color:#e94560}
.logout-btn{background:none;border:1px solid #e94560;color:#e94560;padding:8px 15px;border-radius:20px;cursor:pointer}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;width:90%;max-width:1000px;margin-top:20px}
.feature-card{background:rgba(255,255,255,0.08);border-radius:15px;padding:30px;text-align:center;cursor:pointer;transition:all 0.3s;border:2px solid transparent}
.feature-card:hover{border-color:#e94560;transform:translateY(-5px);box-shadow:0 10px 30px rgba(233,69,96,0.3)}
.feature-icon{font-size:3em;margin-bottom:15px}
.feature-title{font-size:1.3em;font-weight:bold;margin-bottom:10px;color:#e94560}
.feature-desc{color:rgba(255,255,255,0.7);font-size:0.9em}
/* Zodiac */
#zodiac-page{padding-top:80px}
.back-btn{position:fixed;top:15px;left:20px;z-index:100;background:rgba(255,255,255,0.1);border:none;color:white;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:1em}
.zodiac-container{width:90%;max-width:600px;margin-top:20px}
.zodiac-select{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.zodiac-opt{padding:15px;border-radius:10px;background:rgba(255,255,255,0.08);cursor:pointer;text-align:center;transition:all 0.3s;border:2px solid transparent}
.zodiac-opt:hover,.zodiac-opt.selected{border-color:#e94560;background:rgba(233,69,96,0.2)}
.zodiac-opt .icon{font-size:2em}
.aspect-select{margin:15px 0}
.aspect-select label{display:block;margin:8px 0;cursor:pointer}
.result-box{background:rgba(255,255,255,0.08);border-radius:15px;padding:25px;margin:20px 0;width:100%}
.result-title{font-size:1.5em;color:#e94560;margin-bottom:15px;text-align:center}
.result-text{line-height:1.8;color:rgba(255,255,255,0.9)}
/* Tarot */
.tarot-cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.tarot-card{width:120px;height:200px;background:rgba(255,255,255,0.1);border-radius:10px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;font-size:4em;border:2px solid transparent}
.tarot-card:hover{transform:translateY(-10px);border-color:#e94560}
.tarot-card.flipped{background:linear-gradient(135deg,#e94560,#0f3460);color:white}
/* I Ching */
.iching-result{text-align:center;margin:20px 0}
.iching-hexagram{font-size:5em;margin:20px 0}
/* Event */
.event-input{width:100%;padding:15px;border-radius:10px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;font-size:1em;resize:vertical;min-height:100px;outline:none;margin:10px 0}
/* Fortune stick */
.stick-area{width:200px;height:300px;background:rgba(255,255,255,0.05);border-radius:15px;margin:20px auto;position:relative;cursor:pointer;border:2px dashed rgba(255,255,255,0.2)}
.stick-btn{padding:15px 40px;font-size:1.2em;margin:20px 0}
/* Comment */
.comment-input{display:flex;gap:10px;margin:20px 0;width:100%}
.comment-input input{flex:1;padding:12px 20px;border-radius:25px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;outline:none}
.comment-list{width:100%;max-height:400px;overflow-y:auto}
.comment-item{background:rgba(255,255,255,0.05);border-radius:10px;padding:15px;margin:10px 0}
.comment-author{color:#e94560;font-weight:bold}
.comment-time{color:rgba(255,255,255,0.5);font-size:0.8em;float:right}
.comment-text{margin-top:8px;line-height:1.6}
/* Footer */
.footer{text-align:center;padding:30px;color:rgba(255,255,255,0.5);font-size:0.9em;width:100%}
.footer a{color:#e94560;text-decoration:none}
/* Responsive */
@media(max-width:600px){.features{grid-template-columns:1fr}.zodiac-select{grid-template-columns:repeat(2,1fr)}.tarot-card{width:100px;height:170px}}
/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake 0.5s ease}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spinning{animation:spin 1s linear infinite}
</style>
</head>
<body>

<!-- Login Page -->
<div id="login-page" class="page active">
<div class="login-box fade-in">
<h1>🔮 星座占卜</h1>
<p style="margin-bottom:20px;color:rgba(255,255,255,0.7)">登录以开始你的占卜之旅</p>

</div>
<div class="avatar-preview" id="avatar-preview">

</div>
</div>
<button class="btn btn-primary" onclick="doLogin()" style="margin-top:20px;width:100%">进入占卜世界 ✨</button>
</div>
</div>

<!-- Main Page -->
<div id="main-page" class="page">
<div class="top-bar">
<button class="back-btn" onclick="doLogout()" style="position:static">退出</button>

</div>
<div></div>
</div>

</div>
<div class="feature-card" onclick="showPage('iching-page')">

<div class="feature-title">易经占卜</div>
<div class="feature-desc">铜钱起卦，解读天机</div>
</div>
<div class="feature-card" onclick="showPage('event-page')">

<div class="feature-desc">输入事件，选择占卜方式</div>
</div>
<div class="feature-card" onclick="showPage('fortune-page')">

<div class="feature-card" onclick="showPage('comment-page')">

</div>
</div>
<div class="footer">

<div class="stick-area" id="stick-area" onclick="drawFortuneStick()">
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.3);font-size:3em">🏮</div>
</div>
<button class="btn btn-primary stick-btn" onclick="drawFortuneStick()" style="display:none" id="stick-btn">求签 ✨</button>
<div class="result-box" id="fortune-result" style="display:none"></div>
</div>
</div>

<div style="margin-top:80px;width:90%;max-width:700px">

</div>
<div class="comment-list" id="comment-list"></div>
</div>
<div class="footer" style="margin-top:20px">
<p>此网站仅供娱乐——制作人Jason杨</p>
</div>
</div>

function getZodiacByDate(dateStr) {
  // dateStr: YYYY-MM-DD
  const d = new Date(dateStr);
  const m = d.getMonth() + 1;
  const day = d.getDate();
  if ((m === 3 && day >= 21) || (m === 4 && day <= 19)) return 0;  // 白羊座
  if ((m === 4 && day >= 20) || (m === 5 && day <= 20)) return 1;  // 金牛座
  if ((m === 5 && day >= 21) || (m === 6 && day <= 21)) return 2;  // 双子座
  if ((m === 6 && day >= 22) || (m === 7 && day <= 22)) return 3;  // 巨蟹座
  if ((m === 7 && day >= 23) || (m === 8 && day <= 22)) return 4;  // 狮子座
  if ((m === 8 && day >= 23) || (m === 9 && day <= 22)) return 5;  // 处女座
  if ((m === 9 && day >= 23) || (m === 10 && day <= 23)) return 6; // 天秤座
  if ((m === 10 && day >= 24) || (m === 11 && day <= 22)) return 7; // 天蝎座
  if ((m === 11 && day >= 23) || (m === 12 && day <= 21)) return 8; // 射手座
  if ((m === 12 && day >= 22) || (m === 1 && day <= 19)) return 9;  // 摩羯座
  if ((m === 1 && day >= 20) || (m === 2 && day <= 18)) return 10;  // 水瓶座
  return 11; // 双鱼座
}

// ========== Init ==========
function init() {
  // Avatar presets
  const presetsEl = document.getElementById('avatar-presets');
  USER_AVATARS.forEach((emoji, i) => {
    const opt = document.createElement('div');
    opt.className = 'avatar-opt';
    opt.textContent = emoji;
    opt.onclick = () => selectAvatar(emoji, opt);
    presetsEl.appendChild(opt);
  });
  
  // Zodiac select
  const zodiacEl = document.getElementById('zodiac-select');
  ZODIAC_DATA.forEach((z, i) => {
    const opt = document.createElement('div');
    opt.className = 'zodiac-opt';
    opt.innerHTML = `<div class="icon">${z.icon}</div><div>${z.name}</div>`;
    opt.onclick = () => selectZodiac(i, opt);
    zodiacEl.appendChild(opt);
  });
  
  // Check login
  const saved = localStorage.getItem('zodiac_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    showMainPage();
  }
  
  // Avatar upload
  document.getElementById('avatar-upload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('avatar-img').src = ev.target.result;
        document.getElementById('avatar-preview').style.display = 'block';
        selectedAvatar = ev.target.result;
        // Deselect preset
        document.querySelectorAll('.avatar-opt').forEach(el => el.classList.remove('selected'));
      };
      reader.readAsDataURL(file);
    }
  });
  
  loadComments();
}

function selectAvatar(emoji, el) {
  document.querySelectorAll('.avatar-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedAvatar = emoji;
  document.getElementById('avatar-preview').style.display = 'none';
}

function selectZodiac(idx, el) {
  document.querySelectorAll('.zodiac-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedZodiac = idx;
}

function doLogin() {
  const nick = document.getElementById('nickname-input').value.trim();
  if (!nick) { alert('请输入昵称'); return; }
  if (!selectedAvatar) { alert('请选择或上传头像'); return; }
  const birthday = document.getElementById('birthday-input').value;
  currentUser = { nickname: nick, avatar: selectedAvatar, birthday: birthday || '' };
  if (birthday) {
    const zIdx = getZodiacByDate(birthday);
    currentUser.zodiac = zIdx;
  }
  localStorage.setItem('zodiac_user', JSON.stringify(currentUser));
  showMainPage();
}

function showMainPage() {
  document.getElementById('top-avatar').src = currentUser.avatar.startsWith('data:') ? currentUser.avatar : '';
  document.getElementById('top-avatar').textContent = currentUser.avatar.startsWith('data:') ? '' : currentUser.avatar;
  document.getElementById('top-nick').textContent = currentUser.nickname;
  // Auto-select zodiac if birthday is known
  if (currentUser.zodiac !== undefined && currentUser.zodiac !== null) {
    selectedZodiac = currentUser.zodiac;
    document.querySelectorAll('.zodiac-opt').forEach(e => e.classList.remove('selected'));
    document.querySelectorAll('.zodiac-opt')[selectedZodiac].classList.add('selected');
  }
  showPage('main-page');
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('zodiac_user');
  showPage('login-page');
}

// ========== Tarot ==========
function drawTarot(num) {
  const container = document.getElementById('tarot-cards');
  container.innerHTML = '';
  document.getElementById('tarot-result').innerHTML = '';
  
  const drawn = [];
  const available = [...TAROT_MAJOR];
  for (let i = 0; i < num; i++) {
    const idx = Math.floor(Math.random() * available.length);
    drawn.push(available.splice(idx, 1)[0]);
  }
  
  drawn.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'tarot-card';
    el.textContent = '?';
    el.onclick = () => flipCard(el, card);
    container.appendChild(el);
  });
  
  // 添加重新抽牌按钮
  const btn = document.createElement('button');
  btn.className = 'btn btn-secondary';
  btn.style.marginTop = '15px';
  btn.style.fontSize = '0.9em';
  btn.textContent = '🔄 重新抽牌';
  btn.onclick = () => drawTarot(num);
  container.appendChild(btn);
}

function flipCard(el, card) {
  if (el.classList.contains('flipped')) return;
  const isReverse = Math.random() < 0.3;
  el.classList.add('flipped');
  el.textContent = card.icon;
  el.style.transform = isReverse ? 'rotate(180deg)' : '';
  
  const meaning = isReverse ? card.reverse : card.meaning;
  const result = `
    <div class="result-title">${card.icon} ${card.name}${isReverse ? '（逆位）' : '（正位）'}</div>
    <div class="result-text">
      <p><strong>牌名：</strong>${card.name}</p>
      <p><strong>位置：</strong>${isReverse ? '逆位 ⬇' : '正位 ⬆'}</p>
      <p><strong>含义：</strong>${meaning}</p>
      <p style="margin-top:15px;color:rgba(255,255,255,0.5);font-size:0.9em">🔮 此网站仅供娱乐——制作人Jason杨</p>
    </div>
  `;
  
  const el2 = document.getElementById('tarot-result');
  el2.style.display = 'block';
  const resultDiv = document.createElement('div');
  resultDiv.className = 'result-box';
  resultDiv.style.marginTop = '10px';
  resultDiv.innerHTML = result;
  el2.appendChild(resultDiv);
  el2.classList.add('fade-in');
}

  el.classList.add('fade-in');
  
  document.getElementById('stick-area').style.display = 'none';
  document.getElementById('stick-btn').style.display = 'inline-block';
}

// ========== Comments ==========
function loadComments() {
  const comments = JSON.parse(localStorage.getItem('zodiac_comments') || '[]');
  const list = document.getElementById('comment-list');
  list.innerHTML = '';
  comments.reverse().forEach(c => {
    const div = document.createElement('div');
    div.className = 'comment-item';
    div.innerHTML = `
      <span class="comment-author">${c.avatar} ${c.nickname}</span>
      <span class="comment-time">${c.time}</span>
      <div class="comment-text">${c.text}</div>
    `;
    list.appendChild(div);
  });
}

function addComment() {
  if (!currentUser) { alert('请先登录'); return; }
  const text = document.getElementById('comment-input').value.trim();
  if (!text) { alert('请输入留言'); return; }
  
  const comments = JSON.parse(localStorage.getItem('zodiac_comments') || '[]');
  comments.push({
    avatar: currentUser.avatar.startsWith('data:') ? '🐾' : currentUser.avatar,
    nickname: currentUser.nickname,
    text: text,
    time: new Date().toLocaleString('zh-CN')
  });
  localStorage.setItem('zodiac_comments', JSON.stringify(comments));
  document.getElementById('comment-input').value = '';
  loadComments();
}

// ========== Start ==========
init();
</script>
</body>
</html>
